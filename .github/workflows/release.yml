name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: tag-push events are not reliably delivered for this repo
  # (see #34) — run from the Actions tab or `gh workflow run release.yml
  # --ref <tag>` with the tag checked out so npm publish sees the right version.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the GitHub Release
      id-token: write  # Required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Trusted publishing requires Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0  # OIDC trusted publishing requires npm >= 11.5.1; pinned for reproducible releases

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish  # Auth via OIDC trusted publishing; provenance is automatic

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
